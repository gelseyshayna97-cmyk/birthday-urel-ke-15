.slide.active{

}

const slides =
    document.querySelectorAll(".slide");


let current =
    0;


const next =
    document.getElementById("next");


const back =
    document.getElementById("back");


const counter =
    document.getElementById("counter");



function showSlide(index){

    slides.forEach(
        (slide,i)=>{

            slide.classList.toggle(
                "active",
                i === index
            );

        }
    );


    counter.textContent =
        `${index + 1} / ${slides.length}`;


    back.style.visibility =
        index === 0
        ? "hidden"
        : "visible";


    next.textContent =
        index === slides.length - 1
        ? "↻"
        : "→";

}



showSlide(0);



/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    ()=>{

        if(
            current <
            slides.length - 1
        ){

            current++;

        }else{

            current = 0;

        }


        showSlide(current);

    }
);



/* =====================================================
   BACK
===================================================== */

back.addEventListener(
    "click",
    ()=>{

        if(current > 0){

            current--;

            showSlide(current);

        }

    }
);

            endX - startX;


        if(
            Math.abs(distance) > 50
        ){

            if(distance < 0){

                next.click();

            }else{

                back.click();

            }

        }

    }
);

</script>
